<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leaf Detector - Pillayar Palaiyam</title><style>body{font-family:Arial;text-align:center;background:#f0fdf4;padding:15px}.card{max-width:450px;margin:auto;background:#fff;padding:20px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}h1{color:#14532d;font-size:22px}#webcam-container{background:#000;height:300px;border-radius:15px;margin:10px 0;overflow:hidden}#webcam-container canvas{width:100%;height:100%}button{background:#16a34a;color:#fff;border:0;padding:15px;width:100%;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin:5px 0}.h{background:#dcfce7;color:#166534;padding:12px;border-radius:10px;margin:5px;font-weight:bold}.d{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;margin:5px;font-weight:bold}input{margin:10px 0}</style></head><body><div class="card"><h1> Pillayar Palaiyam Leaf AI</h1><p>Model: Sdiija38R | 46 Images</p><button onclick="init()"> START CAMERA</button><div id="webcam-container"></div><div id="label-container"></div><hr><input type="file" accept="image/*" onchange="handleFile(this)"><p> Upload Leaf Photo</p><div id="preview"></div></div><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script><script>const URL="https://teachablemachine.withgoogle.com/models/Sdiija38R/";let model,webcam,labelContainer,maxPredictions;async function init(){const modelURL=URL+"model.json";const metadataURL=URL+"metadata.json";model=await tmImage.load(modelURL,metadataURL);maxPredictions=model.getTotalClasses();webcam=new tmImage.Webcam(400,400,true);await webcam.setup();await webcam.play();window.requestAnimationFrame(loop);document.getElementById("webcam-container").appendChild(webcam.canvas);labelContainer=document.getElementById("label-container");for(let i=0;i<maxPredictions;i++){labelContainer.appendChild(document.createElement("div"))}}async function loop(){webcam.update();await predict();window.requestAnimationFrame(loop)}async function predict(){const p=await model.predict(webcam.canvas);for(let i=0;i<maxPredictions;i++){const prob=(p[i].probability*100).toFixed(1);const el=labelContainer.childNodes[i];el.innerText=p[i].className+": "+prob+"%";if(p[i].className.toLowerCase().includes("1")||p[i].className.toLowerCase().includes("healthy")){el.className=prob>60?"h":""; if(prob>60)el.innerText=" HEALTHY "+prob+"%";}else{el.className=prob>60?"d":""; if(prob>60)el.innerText=" DISEASED "+prob+"%";}}}async function handleFile(input){const file=input.files[0];const img=document.createElement("img");img.style.width="100%";img.src=URL.createObjectURL(file);document.getElementById("preview").innerHTML="";document.getElementById("preview").appendChild(img);if(!model){const modelURL=URL+"model.json";const metadataURL=URL+"metadata.json";model=await tmImage.load(modelURL,metadataURL);maxPredictions=model.getTotalClasses();labelContainer=document.getElementById("label-container");labelContainer.innerHTML="";for(let i=0;i<maxPredictions;i++)labelContainer.appendChild(document.createElement("div"))}img.onload=async()=>{const p=await model.predict(img);for(let i=0;i<maxPredictions;i++){const prob=(p[i].probability*100).toFixed(1);labelContainer.childNodes[i].innerText=p[i].className+": "+prob+"%";}}}</script></body></html>
